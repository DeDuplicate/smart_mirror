# Send audio out HDMI, not the 3.5mm jack.
#
# Two playback cards exist on a Pi with vc4-kms-v3d: "bcm2835 Headphones"
# (the analog jack) and "vc4hdmi". The analog one enumerates as card 0, so
# ALSA's default is the headphone socket unless told otherwise -- a mirror
# with no /etc/asound.conf plays its music into an unplugged jack, silently
# and with no error anywhere.
#
# Routing through the named "hdmi:" PCM is required, not stylistic. vc4hdmi's
# raw device accepts ONLY IEC958_SUBFRAME_LE (S/PDIF-framed) data, so both
# "hw:" and "plughw:" are rejected with "Sample format non available" --
# plug alone cannot do IEC958 framing. The framing lives in
# /usr/share/alsa/cards/vc4-hdmi.conf, which "hdmi:CARD=vc4hdmi" pulls in.
#
# Cards are named, not numbered: card order is not guaranteed across boots.

pcm.!default {
    type plug
    slave.pcm "hdmi:CARD=vc4hdmi,DEV=0"
}
ctl.!default {
    type hw
    card vc4hdmi
}
